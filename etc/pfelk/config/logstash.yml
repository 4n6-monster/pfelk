# logstash.yml
################################################################################
# Version: 26.10.1                                                             #
# Required: True (Docker)                                                      #
# Description: Logstash runtime settings for pfELK.                            #
################################################################################

api.http.host: "${PFELK_LOGSTASH_API_HOST:127.0.0.1}"

# Durable buffering protects short Elasticsearch interruptions.
queue.type: persisted
queue.max_bytes: "${PFELK_QUEUE_SIZE:2gb}"
queue.compression: balanced

# Preserve supported output/indexing failures for investigation while bounding
# both disk usage and age.
dead_letter_queue.enable: true
dead_letter_queue.max_bytes: "${PFELK_DLQ_SIZE:1gb}"
dead_letter_queue.retain.age: "${PFELK_DLQ_RETAIN:14d}"
dead_letter_queue.storage_policy: drop_older

# Legacy Stack Monitoring is intentionally disabled. Use Elastic Agent/OTel or
# configure monitoring explicitly when required.
xpack.monitoring.enabled: false
